name: Test

on: push
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 
    github.run_id }}
  cancel-in-progress: true

jobs:
  main:
    if: github.event_name == 'push' || 
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', 3.12.4, '3.13', pypy-3.9]
        os: [ubuntu-24.04, macOS-latest, windows-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox

    - name: Unit tests
      if: "!startsWith(matrix.python-version, 'pypy')"
      run: tox -e ci-py$(echo ${{ matrix.python-version }} | tr -d '.') -- -v 
        --color=yes

    - name: Unit tests (pypy)
      if: startsWith(matrix.python-version, 'pypy')
      run: tox -e ci-pypy3 -- -v --color=yes

    - name: Upload coverage to Coveralls
      if: github.repository == 'psf/black' && matrix.os == 'ubuntu-24.04' && 
        !startsWith(matrix.python-version, 'pypy')
      uses: 
        AndreMiras/coveralls-python-action@ac868b9540fad490f7ca82b8ca00480fd751ed19
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel: true
        flag-name: py${{ matrix.python-version }}-${{ matrix.os }}
        debug: true

  coveralls-finish:
    needs: main
    if: github.repository == 'psf/black'

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Send finished signal to Coveralls
      uses: 
        AndreMiras/coveralls-python-action@ac868b9540fad490f7ca82b8ca00480fd751ed19
      with:
        parallel-finished: true
        debug: true

  uvloop:
    if: github.event_name == 'push' || 
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v5

    - name: Set up latest Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install black with uvloop
      run: |
        python -m pip install pip --upgrade --disable-pip-version-check
        python -m pip install -e ".[uvloop]"

    - name: Format ourselves
      run: python -m black --check src/ tests/
